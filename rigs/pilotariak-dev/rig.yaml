version: "0.2"
name: pilotariak-dev
summary: >
  A four-seat team for Pilotariak repos (frontis, kancha, azkena, xilo, plaza, website, decisions, infrastructure): a lead who takes your goal and scopes the work, a builder, a code reviewer, and a QA seat. Launch from a clone with --cwd. The installing agent matches each seat's runtime to the providers you have logged in. #magic___^_^___line
culture_file: CULTURE.md

docs:
- path: README.md

# Start steps shared by every seat; each seat's role file comes from its profile.
startup:
  files:
  - path: agents/pilotariak-dev/startup/context.md
    delivery_hint: send_text
    required: true
  # Each seat proves it received its start steps and can reach OpenRig.
  # `rig ps --nodes` shows ORIENTED: verified, or missing until it does.
  actions:
  - type: startup_proof
    value: authenticated
    idempotent: true

# OpenRig writes its instruction blocks into each seat's working directory.
# Claude Code seats get them in CLAUDE.local.md, so they stay out of a
# project's own CLAUDE.md. Codex seats always use AGENTS.md.
managed_blocks:
  claude-code: CLAUDE.local.md

# No permission_policy/non_interruptive here: seats launch under each
# runtime's normal prompts (Claude Code's acceptEdits, Codex's
# workspace-write). See README.md "Permissions" for what that means, the
# commands it blocks (git push, network from a Codex seat), and how to opt
# into a faster, prompt-free posture if you want it.

pods:
- id: orch
  label: Orchestration
  summary: Starts from your goal, scopes the work, and keeps the pull request description true.
  members:
  - id: lead
    agent_ref: "local:agents/pilotariak-dev"
    profile: lead
    runtime: codex
    cwd: "."
  edges: []

- id: dev
  label: Development
  summary: Builds, tests, and independently reviews the change.
  members:
  - id: build
    agent_ref: "local:agents/pilotariak-dev"
    profile: builder
    runtime: claude-code
    cwd: "."
  - id: review
    agent_ref: "local:agents/pilotariak-dev"
    profile: code-reviewer
    runtime: codex
    cwd: "."
  - id: qa
    agent_ref: "local:agents/pilotariak-dev"
    profile: qa
    runtime: claude-code
    cwd: "."
  edges:
  - kind: delegates_to
    from: build
    to: review
  - kind: delegates_to
    from: build
    to: qa

edges:
- kind: delegates_to
  from: orch.lead
  to: dev.build
- kind: can_observe
  from: orch.lead
  to: dev.review
- kind: can_observe
  from: orch.lead
  to: dev.qa
