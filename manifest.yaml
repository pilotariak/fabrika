name: fabrika
version: "0.1.0"
taxonomy: world
purpose: >-
  How Pilotariak projects fit together, and how a change moves from idea to merged pull request across the org: frontis, kancha, azkena, xilo, plaza, website, decisions, infrastructure. Points at each repository's own AGENTS.md and CI instead of copying them.
files:
- path: identity/what-pilotariak-is-for.md
  role: identity
  summary: "What Pilotariak is, the repo map, and how a proposed change is judged."
- path: workflow/contributing-with-agents.md
  role: workflow
  summary: "The shared loop: hooks, DCO sign-off, conventional commits, release-please, review."
- path: workflow/agentic-automation.md
  role: workflow
  summary: "The agentic CI pattern piloted in frontis (issue/PR triage, dependabot bundling) and how to extend it."
- path: craft/proving-a-change.md
  role: craft
  summary: "Per-repo commands that prove a change works, and what to regenerate before opening a PR."
- path: craft/tells-of-a-wrong-claim.md
  role: craft
  summary: "Stack-specific moments you're about to be wrong, and the cheapest check for each."
atoms:
- id: what-pilotariak-is-for
  address: identity/what-pilotariak-is-for.md
  situations: [fresh, post-compaction]
  order: 10
  priority: core
- id: contribution-loop
  address: workflow/contributing-with-agents.md
  situations: [fresh]
  order: 20
  requires: [what-pilotariak-is-for]
  priority: core
- id: agentic-automation
  address: workflow/agentic-automation.md
  situations: [fresh]
  order: 25
  requires: [contribution-loop]
  priority: recommended
- id: proving-a-change
  address: craft/proving-a-change.md
  situations: [fresh]
  order: 30
  requires: [what-pilotariak-is-for]
  priority: recommended
- id: tells-of-a-wrong-claim
  address: craft/tells-of-a-wrong-claim.md
  situations: [fresh, post-compaction]
  order: 40
  priority: recommended
profiles:
- id: reviewer
  situations: [fresh]
  phases:
  - id: purpose
    atoms: [what-pilotariak-is-for]
  - id: craft
    atoms: [proving-a-change, tells-of-a-wrong-claim]
