schema_version: "1"
description: "Pilotariak TPM — breaks a scoped goal into tasks, creates the producers, then on handoff creates the verifiers against the same branch"

agent_instructions: agents.md
system_prompt: system-prompt.md

default_harness_config: codex

skills:
- uri: "gh://Pilotariak/fabrika/pilotariak-context"
# TPM is the delegation layer of the Chunky/Large tree: creates producers
# (db, swe-1, swe-2), then on handoff creates verifiers (swe-test,
# ui-test, perf-test, secops, reviewer) — enforcing this skill's rule that
# a verifier is never the same agent that produced the work it checks.
# Vendored from scion-frontiers/agent-team and adapted for fabrika.
- uri: "gh://Pilotariak/fabrika/software-engineering-process"
# TPM must not delete a producer or verifier while its work is still
# unpushed — this skill owns that lifecycle rule. Vendored from
# scion-frontiers/agent-team and adapted for fabrika's actual push
# semantics.
- uri: "gh://Pilotariak/fabrika/artifact-durability"
