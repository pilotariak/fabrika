# Read by OpenRig when it builds this rig into a bundle.
compatibility:
  min_cli_version: "0.6.6"
  min_daemon_version: "0.6.6"

# preconditions: what to know and do before installing, shown before install.
# Run the commands in order in one shell, then run the install command in
# that same shell. OpenRig shows them; it doesn't run or check them.
preconditions:
- name: Open a shell at the root of your clone of the Pilotariak repo you want to work on, set up the way its own README/AGENTS.md says.
- name: Add the fabrika context pack, once per machine, from that same shell.
  commands:
  - rig context add --git https://github.com/Pilotariak/fabrika.git
- name: "Keep OpenRig's files out of your commits: from the root of your clone, add CLAUDE.local.md, AGENTS.md and /.openrig/ to .git/info/exclude. The lead adds any missing entries when it starts."
