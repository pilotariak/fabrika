name: pilotariak-dev
version: "1.0"
description: >
  A seat on the pilotariak-dev rig, which works in a clone of a Pilotariak repository. The rig member's profile picks the role: lead, builder, code-reviewer, or qa. #magic___^_^___line
# Deliberately lean: no borrowed skill tree. A richer OpenRig team bundle
# typically ships a couple dozen generic operating skills (mission/slice
# bookkeeping, compaction restore, queue handoff, ...) alongside its roles.
# This bundle trades that sophistication for staying small and fully owned
# here — each profile below is just its role's guidance plus the shared
# startup steps.
resources:
  guidance:
  - id: lead
    path: guidance/lead.md
  - id: builder
    path: guidance/builder.md
  - id: code-reviewer
    path: guidance/code-reviewer.md
  - id: qa
    path: guidance/qa.md
  - id: startup-context
    path: startup/context.md

profiles:
  lead:
    summary: Turns the person's goal into scoped work and keeps the PR description true.
    uses:
      guidance: [lead]
    startup:
      files:
      - path: guidance/lead.md
        delivery_hint: send_text
        required: true
      actions: []

  builder:
    summary: Makes the change on its own branch, and proves it by effect.
    uses:
      guidance: [builder]
    startup:
      files:
      - path: guidance/builder.md
        delivery_hint: send_text
        required: true
      actions: []

  code-reviewer:
    summary: Reviews the handed-off commit against the repo's own maps and the code.
    uses:
      guidance: [code-reviewer]
    startup:
      files:
      - path: guidance/code-reviewer.md
        delivery_hint: send_text
        required: true
      actions: []

  qa:
    summary: Runs the checks the change calls for and reports what each one proved.
    uses:
      guidance: [qa]
    startup:
      files:
      - path: guidance/qa.md
        delivery_hint: send_text
        required: true
      actions: []
