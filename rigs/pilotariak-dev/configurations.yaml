# Every configuration installs once as pilotariak-dev in ~/rigs/pilotariak-dev.
# These are runtime choices for the installing agent to match to available
# logins, not separate rig names.
# `rig bundle configurations rigs/pilotariak-dev/rig.yaml` lists them with their
# configuration IDs, and `rig bundle create rigs/pilotariak-dev/rig.yaml --preset <name>`
# (or `--seat pod.member=runtime`) builds one.
# Format: openrig.bundle-configurations/v1 (OpenRig's docs/reference/bundle-formats.md).
schema: openrig.bundle-configurations/v1
recommended: recommended
seats:
  orch.lead: {runtimes: {claude-code: lead, codex: lead}}
  dev.build: {runtimes: {claude-code: builder, codex: builder}}
  dev.review: {runtimes: {claude-code: code-reviewer, codex: code-reviewer}}
  dev.qa: {runtimes: {claude-code: qa, codex: qa}}
presets:
  recommended: {orch.lead: codex, dev.build: claude-code, dev.review: codex, dev.qa: claude-code}
  all-claude: {orch.lead: claude-code, dev.build: claude-code, dev.review: claude-code, dev.qa: claude-code}
  all-codex: {orch.lead: codex, dev.build: codex, dev.review: codex, dev.qa: codex}
