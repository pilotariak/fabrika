schema_version: "1"
description: "Pilotariak PM — entry point for an org-wide goal; scopes it, creates po and tpm, and is the one who says yes before anything ships"

agent_instructions: agents.md
system_prompt: system-prompt.md

default_harness_config: codex

skills:
- uri: "gh://Pilotariak/fabrika/pilotariak-context"
# PM is the issue owner at the top of a Chunky/Large tree (depth > 1):
# creates po and tpm directly, and must enforce the skill's collapse rule
# so a Small-tier goal doesn't spin up all fourteen roles by default.
- uri: "gh://scion-frontiers/agent-team/software-engineering-process"
# PM tracks a multi-agent workstream (po, tpm, and everything tpm creates)
# across a container restart — a single builder never needs this.
- uri: "gh://scion-frontiers/agent-team/agent-state-continuity"
